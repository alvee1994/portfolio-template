# Publishes the page files to GitHub Pages on every push to main.
name: Deploy page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # Skip on the template itself; runs in your copy.
    if: github.repository != 'alvee1994/portfolio-template'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish only the page. Guides, agent notes and Worker code stay out of search results.
      - run: |
          mkdir _site
          cp index.html app.js config.js ribbon.js llms.txt sitemap.xml .nojekyll _site/
          if [ -d assets ]; then cp -r assets _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
