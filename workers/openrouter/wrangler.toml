name = "worker-openrouter"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# CHANGE: your GitHub Pages origin. https://<github-username>.github.io, no path, no trailing slash
ALLOWED_ORIGIN = "https://<github-username>.github.io"
MODEL = "openai/gpt-6-luna"  # an OpenRouter model id with zero data retention providers. See GUIDE.md, "Choose a model"

# Rate limits per visitor IP. namespace_id must differ from your other Workers.
[[ratelimits]]
name = "START_LIMIT"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "MSG_LIMIT"
namespace_id = "1006"
simple = { limit = 20, period = 60 }  # one call per message, no polling

# Secrets (never in this file): OPENROUTER_API_KEY, TURNSTILE_SECRET, SIGNING_SECRET.
# They live in .dev.vars (gitignored) and go up with: npx wrangler deploy --secrets-file .dev.vars
# Knowledge: copy ../profile.example.txt to ../profile.txt and fill it in before deploying.
