name = "worker-claude-messages"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# CHANGE: your GitHub Pages origin. https://<github-username>.github.io, no path, no trailing slash
ALLOWED_ORIGIN = "https://<github-username>.github.io"
MODEL = "claude-sonnet-5-5"  # effort is set to low in worker.js; cache minimum 512 tokens

# Rate limits per visitor IP. namespace_id must differ from your other Workers.
[[ratelimits]]
name = "START_LIMIT"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "MSG_LIMIT"
namespace_id = "1004"
simple = { limit = 20, period = 60 }  # one call per message, no polling

# Secrets (never in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put TURNSTILE_SECRET
#   openssl rand -hex 32 | npx wrangler secret put SIGNING_SECRET
# Knowledge: copy ../profile.example.txt to ../profile.txt and fill it in before deploying.
